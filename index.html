<html lang="ko">
<head>

    <h1 class="sr-only">이끼숲 동료들</h1>

    <button class="wallet" data-open="huntWallet" aria-label="보유 사냥권과 충전"><i data-icon="ticket"></i><b id="ticketCount"></b></button>
    <button class="menu" data-open="settings" aria-label="사냥권·설정"><i data-icon="menu"></i></button>

  <main id="screen"></main>
